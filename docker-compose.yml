# Lance l'API et la démo : docker compose up --build
# API : http://localhost:8000/docs · Démo : http://localhost:8501
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      # Données et figures en lecture seule : elles ne sont pas copiées dans l'image
      - ./data:/app/data:ro
      - ./resultats:/app/resultats:ro
    depends_on:
      api:
        condition: service_healthy
